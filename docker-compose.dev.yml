version: '3.8'

# Development overrides for Obsidian-Memory

services:
  memory:
    container_name: memory-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    depends_on:
      mcp-server:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - DEBUG=true
      - HOT_RELOAD=true
      - WAIT_FOR_HEALTH=true
      - CLOUDFLARE_ACCESS_ENABLED=${CLOUDFLARE_ACCESS_ENABLED:-true}
      - CLOUDFLARE_ACCESS_TEAM_DOMAIN=${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-redleif.cloudflareaccess.com}
      # OAuth configuration for Claude.ai
      - CLOUDFLARE_OAUTH_CLIENT_ID=${CLOUDFLARE_OAUTH_CLIENT_ID}
      - CLOUDFLARE_OAUTH_CLIENT_SECRET=${CLOUDFLARE_OAUTH_CLIENT_SECRET}
    ports:
      - "8766:8765"  # Different port for dev
    volumes:
      - memory-data:/data
      - /home/redleif/vaults:/vaults/jodys-brain:cached  # Jody's unified vault (synced today)
      - ./backend:/app/backend:cached  # Hot reload mount
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memory-dev.rule=Host(`memory-dev.redleif.dev`)"
      - "traefik.http.routers.memory-dev.entrypoints=websecure"
      - "traefik.http.routers.memory-dev.tls.certresolver=cloudflare"
      - "traefik.http.routers.memory-dev.tls=true"
      - "traefik.http.services.memory-dev.loadbalancer.server.port=8765"
      - "traefik.docker.network=proxy"
      # Cloudflare Access headers - Traefik forwards these automatically
      # CF-Access-JWT and CF-Access-JWT-Assertion are forwarded by default
      - "traefik.http.routers.memory-dev.middlewares=memory-dev-headers"
      - "traefik.http.middlewares.memory-dev-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      # MCP endpoint routing - routes /mcp/* to FastAPI backend which proxies to MCP server
      # No need for separate router, /mcp is handled by FastAPI
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp-server:
    container_name: memory-mcp
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    environment:
      - MCP_TRANSPORT=sse
      - MCP_SSE_PORT=3000
      - MCP_PATH=/mcp
      - MCP_SERVER_URL=https://mcp.redleif.dev
      - OBSIDIAN_MEMORY_API_URL=http://memory:8765
      # OAuth configuration for Claude.ai
      - CLOUDFLARE_ACCESS_TEAM_DOMAIN=${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-redleif.cloudflareaccess.com}
      - CLOUDFLARE_OAUTH_CLIENT_ID=${CLOUDFLARE_OAUTH_CLIENT_ID}
      - CLOUDFLARE_OAUTH_CLIENT_SECRET=${CLOUDFLARE_OAUTH_CLIENT_SECRET}
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Note: MCP server is accessed via FastAPI proxy at /mcp, not directly via Traefik

networks:
  proxy:
    external: true
