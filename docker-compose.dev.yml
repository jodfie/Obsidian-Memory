# Development overrides for Obsidian-Memory
#
# Required env vars: BASE_DOMAIN, VAULT_PATH (see .env.example)

services:
  memory:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: memory-dev
    depends_on:
      mcp-server:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - DEBUG=true
      - HOT_RELOAD=true
      - WAIT_FOR_HEALTH=true
      - VAULT_PATH=/vaults
      - CLOUDFLARE_ACCESS_ENABLED=${CLOUDFLARE_ACCESS_ENABLED:-true}
      - CLOUDFLARE_ACCESS_TEAM_DOMAIN=${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-${CF_ACCESS_TEAM:-}}
      - CLOUDFLARE_OAUTH_CLIENT_ID=${CLOUDFLARE_OAUTH_CLIENT_ID}
      - CLOUDFLARE_OAUTH_CLIENT_SECRET=${CLOUDFLARE_OAUTH_CLIENT_SECRET}
    ports:
      - "8766:8765"
    volumes:
      - memory-data:/data
      - ${VAULT_PATH:?VAULT_PATH must be set}:/vaults:rw
      - ./backend:/app/backend:cached  # Hot reload mount
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memory-dev.rule=Host(`memory-dev.${BASE_DOMAIN:?BASE_DOMAIN must be set}`)"
      - "traefik.http.routers.memory-dev.entrypoints=web"
      - "traefik.http.services.memory-dev.loadbalancer.server.port=8765"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.memory-dev.middlewares=memory-dev-headers"
      - "traefik.http.middlewares.memory-dev-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp-server:
    container_name: memory-mcp-dev
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    environment:
      - MCP_TRANSPORT=sse
      - MCP_SSE_PORT=3000
      - MCP_PATH=/mcp
      - MCP_SERVER_URL=https://memory-dev.${BASE_DOMAIN}
      - OBSIDIAN_MEMORY_API_URL=http://memory-dev:8765
      - CLOUDFLARE_ACCESS_TEAM_DOMAIN=${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-${CF_ACCESS_TEAM:-}}
      - CLOUDFLARE_OAUTH_CLIENT_ID=${CLOUDFLARE_OAUTH_CLIENT_ID}
      - CLOUDFLARE_OAUTH_CLIENT_SECRET=${CLOUDFLARE_OAUTH_CLIENT_SECRET}
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    container_name: memory-silverbullet-dev
    environment:
      - SB_SHELL_BACKEND=off
      - SB_SPACE_IGNORE=.obsidian,.smart-env,.stfolder,.Trash,.backups,.vscode,.gitignore,.stignore
    volumes:
      - ${VAULT_PATH}:/space:rw
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  proxy:
    external: true
