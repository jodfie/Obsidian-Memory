version: '3.8'

# Production overrides for Obsidian-Memory

services:
  memory:
    image: ghcr.io/jodfie/obsidian-memory:latest
    container_name: memory
    depends_on:
      mcp-server:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEBUG=false
      - VAULT_PATH=/vaults
      - CLOUDFLARE_ACCESS_ENABLED=${CLOUDFLARE_ACCESS_ENABLED:-true}
      - CLOUDFLARE_ACCESS_TEAM_DOMAIN=${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-redleif.cloudflareaccess.com}
      # OAuth configuration for Claude.ai
      - CLOUDFLARE_OAUTH_CLIENT_ID=${CLOUDFLARE_OAUTH_CLIENT_ID}
      - CLOUDFLARE_OAUTH_CLIENT_SECRET=${CLOUDFLARE_OAUTH_CLIENT_SECRET}
    volumes:
      - ${VAULT_HOST_PATH:-/home/jodfie/vault}:/vaults:rw
      - memory-data:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memory.rule=Host(`memory.redleif.dev`)"
      - "traefik.http.routers.memory.entrypoints=websecure"
      - "traefik.http.routers.memory.tls.certresolver=cloudflare"
      - "traefik.http.services.memory.loadbalancer.server.port=8765"
      - "traefik.docker.network=reverse_proxy"
    networks:
      - reverse_proxy
    restart: unless-stopped

  mcp-server:
    image: ghcr.io/jodfie/obsidian-memory-mcp:latest
    container_name: memory-mcp
    environment:
      - MCP_TRANSPORT=sse
      - MCP_SSE_PORT=3000
      - MCP_PATH=/mcp
      - MCP_SERVER_URL=https://memory.redleif.dev
      - OBSIDIAN_MEMORY_API_URL=http://memory:8765
      - NODE_ENV=production
      # OAuth configuration for Claude.ai
      - CLOUDFLARE_ACCESS_TEAM_DOMAIN=${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-redleif.cloudflareaccess.com}
      - CLOUDFLARE_OAUTH_CLIENT_ID=${CLOUDFLARE_OAUTH_CLIENT_ID}
      - CLOUDFLARE_OAUTH_CLIENT_SECRET=${CLOUDFLARE_OAUTH_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    networks:
      - reverse_proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Note: MCP server is accessed via FastAPI proxy at /mcp, not directly via Traefik

  # cloudflared tunnel is managed separately (see ~/docker/cloudflared-compose.yml)

volumes:
  memory-data:
    driver: local

networks:
  reverse_proxy:
    external: true
