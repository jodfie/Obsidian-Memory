version: '3.8'

# Production overrides for Obsidian-Memory
#
# Required env vars (set in .env or export):
#   BASE_DOMAIN        - Your domain (e.g., example.com)
#   VAULT_PATH         - Host path to vaults directory (e.g., /home/user/vaults)
#
# Optional env vars:
#   TAILSCALE_IP       - Tailscale IP for VPN-only port bindings (omit to disable)
#   AUTH_DOMAIN        - Auth provider domain (defaults to auth.${BASE_DOMAIN})
#   CF_ACCESS_TEAM     - Cloudflare Access team domain

services:
  memory:
    image: ghcr.io/jodfie/obsidian-memory:latest
    container_name: memory
    command: ["sh", "-c", "cd /app/backend && uvicorn app.main:app --host 0.0.0.0 --port 8765 --workers 2"]
    depends_on:
      mcp-server:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEBUG=false
      - VAULT_PATH=/vaults
      # Force index to use persistent volume instead of home directory
      - INDEX_DB_PATH=/data/.obsidian-memory/index.db
      - CONFIG_FILE=/data/.obsidian-memory/config.json
      - SYNC_STATE_FILE=/data/.obsidian-memory/sync_state.json
      # Supabase OAuth Authentication (preferred)
      - SUPABASE_AUTH_ENABLED=${SUPABASE_AUTH_ENABLED:-true}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      # Cloudflare Access (fallback if Supabase auth disabled)
      - CLOUDFLARE_ACCESS_ENABLED=${CLOUDFLARE_ACCESS_ENABLED:-false}
      - CLOUDFLARE_ACCESS_TEAM_DOMAIN=${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-${CF_ACCESS_TEAM:-}}
      - CLOUDFLARE_OAUTH_CLIENT_ID=${CLOUDFLARE_OAUTH_CLIENT_ID}
      - CLOUDFLARE_OAUTH_CLIENT_SECRET=${CLOUDFLARE_OAUTH_CLIENT_SECRET}
    volumes:
      - ${VAULT_PATH:?VAULT_PATH must be set}:/vaults:rw
      - memory-data:/data
    ports:
      - "127.0.0.1:8765:8765"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memory-api.rule=Host(`memory.${BASE_DOMAIN:?BASE_DOMAIN must be set}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.memory-api.entrypoints=web"
      - "traefik.http.services.memory-api.loadbalancer.server.port=8765"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.memory-api.middlewares=memory-headers"
      - "traefik.http.middlewares.memory-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
    networks:
      - proxy
    restart: unless-stopped

  mcp-server:
    image: ghcr.io/jodfie/obsidian-memory-mcp:latest
    container_name: memory-mcp
    environment:
      - MCP_TRANSPORT=sse
      - MCP_SSE_PORT=3000
      - MCP_PATH=/mcp
      - MCP_SERVER_URL=https://memory.${BASE_DOMAIN}
      - OBSIDIAN_MEMORY_API_URL=http://memory:8765
      - NODE_ENV=production
      # Supabase OAuth Authentication
      - SUPABASE_AUTH_ENABLED=${SUPABASE_AUTH_ENABLED:-true}
      - SUPABASE_URL=${SUPABASE_URL}
    ports:
      - "127.0.0.1:8738:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memory-mcp.rule=Host(`memory.${BASE_DOMAIN}`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.memory-mcp.entrypoints=web"
      - "traefik.http.services.memory-mcp.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.memory-mcp.middlewares=memory-headers"
    networks:
      - proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    container_name: memory-silverbullet
    environment:
      - SB_SHELL_BACKEND=off
      - SB_SPACE_IGNORE=.obsidian,.smart-env,.stfolder,.Trash,.backups,.vscode,.gitignore,.stignore
    volumes:
      - ${VAULT_PATH}:/space:rw
    ports:
      - "127.0.0.1:3100:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: memory-oauth2-proxy
    network_mode: host
    environment:
      - OAUTH2_PROXY_HTTP_ADDRESS=127.0.0.1:4180
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_SKIP_OIDC_DISCOVERY=true
      - OAUTH2_PROXY_OIDC_ISSUER_URL=http://localhost:5556
      - OAUTH2_PROXY_LOGIN_URL=https://${AUTH_DOMAIN:-auth.${BASE_DOMAIN}}/auth
      - OAUTH2_PROXY_REDEEM_URL=http://127.0.0.1:5556/token
      - OAUTH2_PROXY_OIDC_JWKS_URL=http://127.0.0.1:5556/keys
      - OAUTH2_PROXY_PROFILE_URL=http://127.0.0.1:5556/userinfo
      - OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION=true
      - OAUTH2_PROXY_CLIENT_ID=memory-silverbullet
      - OAUTH2_PROXY_CLIENT_SECRET=${SILVERBULLET_OAUTH_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_NAME=_memory_auth
      - OAUTH2_PROXY_REDIRECT_URL=https://memory.${BASE_DOMAIN}/oauth2/callback
      - OAUTH2_PROXY_UPSTREAMS=http://127.0.0.1:3100
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_PASS_ACCESS_TOKEN=false
      - OAUTH2_PROXY_COOKIE_EXPIRE=168h
      - OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL=true
      - OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
      - OAUTH2_PROXY_SKIP_AUTH_REGEX=^/\.client/|^/service_worker\.js
    depends_on:
      silverbullet:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # cloudflared tunnel is managed separately

volumes:
  memory-data:
    driver: local

networks:
  proxy:
    external: true
