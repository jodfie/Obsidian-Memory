version: '3.8'

# Production overrides for Obsidian-Memory

services:
  memory:
    container_name: memory
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    depends_on:
      mcp-server:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEBUG=false
      - CLOUDFLARE_ACCESS_ENABLED=${CLOUDFLARE_ACCESS_ENABLED:-true}
      - CLOUDFLARE_ACCESS_TEAM_DOMAIN=${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-redleif.cloudflareaccess.com}
      # OAuth configuration for Claude.ai
      - CLOUDFLARE_OAUTH_CLIENT_ID=${CLOUDFLARE_OAUTH_CLIENT_ID}
      - CLOUDFLARE_OAUTH_CLIENT_SECRET=${CLOUDFLARE_OAUTH_CLIENT_SECRET}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memory.rule=Host(`memory.redleif.dev`)"
      - "traefik.http.routers.memory.entrypoints=web"
      - "traefik.http.services.memory.loadbalancer.server.port=8765"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.memory.middlewares=memory-headers"
      - "traefik.http.middlewares.memory-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      # MCP endpoint routing - routes /mcp/* to FastAPI backend which proxies to MCP server
      # No need for separate router, /mcp is handled by FastAPI
    networks:
      - proxy
    restart: unless-stopped

  mcp-server:
    container_name: memory-mcp
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    environment:
      - MCP_TRANSPORT=sse
      - MCP_SSE_PORT=3000
      - MCP_PATH=/mcp
      - MCP_SERVER_URL=https://memory.redleif.dev
      - OBSIDIAN_MEMORY_API_URL=http://memory:8765
      - NODE_ENV=production
      # OAuth configuration for Claude.ai
      - CLOUDFLARE_ACCESS_TEAM_DOMAIN=${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-redleif.cloudflareaccess.com}
      - CLOUDFLARE_OAUTH_CLIENT_ID=${CLOUDFLARE_OAUTH_CLIENT_ID}
      - CLOUDFLARE_OAUTH_CLIENT_SECRET=${CLOUDFLARE_OAUTH_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    networks:
      - proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Note: MCP server is accessed via FastAPI proxy at /mcp, not directly via Traefik

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: memory-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy
    restart: unless-stopped
    depends_on:
      - memory
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
