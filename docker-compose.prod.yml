version: '3.8'

# Production overrides for Obsidian-Memory

services:
  memory:
    image: ghcr.io/jodfie/obsidian-memory:latest
    container_name: memory
    depends_on:
      mcp-server:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEBUG=false
      - VAULT_PATH=/vaults
      # Force index to use persistent volume instead of home directory
      - INDEX_DB_PATH=/data/.obsidian-memory/index.db
      - CONFIG_FILE=/data/.obsidian-memory/config.json
      - SYNC_STATE_FILE=/data/.obsidian-memory/sync_state.json
      # Supabase OAuth Authentication (preferred)
      - SUPABASE_AUTH_ENABLED=${SUPABASE_AUTH_ENABLED:-true}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      # Cloudflare Access (fallback if Supabase auth disabled)
      - CLOUDFLARE_ACCESS_ENABLED=${CLOUDFLARE_ACCESS_ENABLED:-false}
      - CLOUDFLARE_ACCESS_TEAM_DOMAIN=${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-redleif.cloudflareaccess.com}
      - CLOUDFLARE_OAUTH_CLIENT_ID=${CLOUDFLARE_OAUTH_CLIENT_ID}
      - CLOUDFLARE_OAUTH_CLIENT_SECRET=${CLOUDFLARE_OAUTH_CLIENT_SECRET}
    volumes:
      - /home/redleif/vaults:/vaults:rw
      - memory-data:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memory-api.rule=Host(`memory.redleif.dev`) && PathPrefix(`/api`)"
      - "traefik.http.routers.memory-api.entrypoints=web"
      - "traefik.http.services.memory-api.loadbalancer.server.port=8765"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.memory-api.middlewares=memory-headers"
      - "traefik.http.middlewares.memory-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
    networks:
      - proxy
    restart: unless-stopped

  mcp-server:
    image: ghcr.io/jodfie/obsidian-memory-mcp:latest
    container_name: memory-mcp
    environment:
      - MCP_TRANSPORT=sse
      - MCP_SSE_PORT=3000
      - MCP_PATH=/mcp
      - MCP_SERVER_URL=https://memory.redleif.dev
      - OBSIDIAN_MEMORY_API_URL=http://memory:8765
      - NODE_ENV=production
      # Supabase OAuth Authentication
      - SUPABASE_AUTH_ENABLED=${SUPABASE_AUTH_ENABLED:-true}
      - SUPABASE_URL=${SUPABASE_URL}
    ports:
      - "8738:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memory-mcp.rule=Host(`memory.redleif.dev`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.memory-mcp.entrypoints=web"
      - "traefik.http.services.memory-mcp.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.memory-mcp.middlewares=memory-headers"
    networks:
      - proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-ui:
    image: ghcr.io/jodfie/obsidian-memory-web-ui:latest
    container_name: memory-web-ui
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=https://memory.redleif.dev/api
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memory-web.rule=Host(`memory.redleif.dev`)"
      - "traefik.http.routers.memory-web.entrypoints=web"
      - "traefik.http.routers.memory-web.priority=1"
      - "traefik.http.services.memory-web.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.memory-web.middlewares=memory-headers"
    networks:
      - proxy
    restart: unless-stopped
    depends_on:
      memory:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # cloudflared tunnel is managed separately (see ~/docker/cloudflared-compose.yml)

volumes:
  memory-data:
    driver: local

networks:
  proxy:
    external: true
