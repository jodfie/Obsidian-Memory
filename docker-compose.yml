version: '3.8'

# Base docker-compose configuration for Obsidian-Memory
# Override with docker-compose.dev.yml or docker-compose.prod.yml

services:
  memory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memory
    environment:
      - API_TITLE=Obsidian-Memory
      - API_VERSION=0.1.0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BASIC_MEMORY_HOME=${BASIC_MEMORY_HOME:-/data}
      - BASIC_MEMORY_SYNC_CHANGES=${BASIC_MEMORY_SYNC_CHANGES:-true}
      - BASIC_MEMORY_SYNC_DELAY=${BASIC_MEMORY_SYNC_DELAY:-1000}
      - GIT_AUTO_COMMIT=${GIT_AUTO_COMMIT:-false}
      - GIT_REMOTE=${GIT_REMOTE:-origin}
      - VAULT_PATH=${VAULT_PATH:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-false}
      - API_TOKEN=${API_TOKEN:-}
      - CLOUDFLARE_ACCESS_ENABLED=${CLOUDFLARE_ACCESS_ENABLED:-false}
      - CLOUDFLARE_ACCESS_TEAM_DOMAIN=${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
    volumes:
      - memory-data:/data
      - memory-vaults:/vaults
    networks:
      - proxy
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: memory-mcp-dev
    environment:
      - MCP_TRANSPORT=sse
      - MCP_SSE_PORT=3000
      - MCP_SSE_PATH=/sse
      - OBSIDIAN_MEMORY_API_URL=http://memory:8765
    networks:
      - proxy
    restart: unless-stopped

volumes:
  memory-data:
    driver: local
  memory-vaults:
    driver: local

networks:
  proxy:
    external: true
