name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: ./backend
        run: |
          pytest tests/ -v

      - name: Type check
        working-directory: ./backend
        run: |
          mypy app/ || echo "Type checking skipped (mypy not configured)"

      - name: Lint
        working-directory: ./backend
        run: |
          ruff check app/ || echo "Linting skipped"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t obsidian-memory:test --target prod -f Dockerfile .

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-container -p 8765:8765 obsidian-memory:test
          sleep 10
          curl -f http://localhost:8765/health || exit 1
          docker stop test-container

  deploy-dev:
    needs: [test, build]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to development
        run: |
          echo "Deployment to dev environment would happen here"
          echo "SSH to server and run:"
          echo "  cd /path/to/obsidian-memory"
          echo "  git pull origin dev"
          echo "  make prod  # or docker compose commands"

  deploy-prod:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deployment to production environment would happen here"
          echo "SSH to server and run:"
          echo "  cd /path/to/obsidian-memory"
          echo "  git pull origin main"
          echo "  make prod  # or docker compose commands"
